; ESP32-S3 N16R8 camera board (Freenove ESP32-S3-WROOM CAM pinout) + OV2640
[platformio]
extra_configs = secrets.ini
default_envs = ota

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv   ; two app slots -> OTA capable
board_build.arduino.memory_type = qio_opi   ; octal PSRAM (R8)

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1        ; built-in USB-Serial/JTAG (auto-reset works)
    -DARDUINO_USB_CDC_ON_BOOT=1 ; Serial goes over USB
    '-DOTA_PASSWORD="${secrets.ota_password}"'

lib_deps =
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@^7.2.0

monitor_speed = 115200

; Flash over USB: pio run -e usb -t upload
[env:usb]
upload_speed = 921600

; Flash over Wi-Fi (default): pio run -t upload
[env:ota]
upload_protocol = espota
upload_port = tv-ambilight.local
upload_flags =
    --auth=${secrets.ota_password}
    --host_port=40000   ; board connects back here; needs an inbound firewall rule
